[project]
name = "financial-advisor-agent"
version = "2.0.0"
description = "QuanAd 2.0 — Multi-agent consensus financial advisor with 5 specialist AI agents"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "google-genai>=1.64.0",
    "inngest>=0.5.15",
    "langchain>=1.2.10",
    "langchain-google-genai>=4.2.1",
    "langgraph>=1.0.9",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pennylane>=0.44.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.2.2",
    "torch>=2.10.0",
    "transformers>=5.0.0",
    "uvicorn>=0.41.0",
    "yfinance>=1.1.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.3",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.pyrefly]
python_interpreter = ".venv/bin/python"
search_path = ["."]
disable_search_path_heuristics = true
disable-search-path-heuristics = true

