# ─────────────────────────────────────────────────────────────────────────────
#  QuanAd — docker-compose.yml
#
#  Services:
#    backend  — FastAPI (QuanAd 2.0) on :8000
#    qdrant   — Vector DB on :6333
#
#  Usage:
#    docker compose up          # start everything
#    docker compose up -d       # detached mode
#    docker compose logs -f     # stream logs
#    docker compose down        # stop and remove containers
#    docker compose down -v     # also remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: quanad-backend:latest
    container_name: quanad-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env                         # shared secrets at project root
    environment:
      # Override localhost URLs with Docker service names
      QDRANT_URL: http://qdrant:6333
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Persist conversation history DB
      - backend-data:/app/data
      # Cache HuggingFace models so they aren't re-downloaded on restart
      - huggingface-cache:/home/quanad/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Qdrant vector database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: quanad-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  qdrant-storage:
    driver: local
  backend-data:
    driver: local
  huggingface-cache:
    driver: local
